name: Sync new members to "all" team

on:
  repository_dispatch:
    types: [org_member_added]
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username to add to the "all" team
        required: true

jobs:
  add-to-all-team:
    runs-on: ubuntu-latest
    steps:
      - name: Add new member to "all" team
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          TARGET_USER: ${{ github.event.inputs.username || github.event.client_payload.username }}
        run: |
          if [ -z "$TARGET_USER" ]; then
            echo "Missing username. Provide workflow_dispatch input 'username' or repository_dispatch payload 'username'."
            exit 1
          fi
          gh api -X PUT "orgs/CoderPush/teams/all/memberships/$TARGET_USER" \
            -f role=member
          echo "Added $TARGET_USER to the all team"
